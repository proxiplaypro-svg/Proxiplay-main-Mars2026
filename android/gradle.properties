org.gradle.jvmargs=-Xmx6144m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true -Dsun.net.inetaddr.ttl=60 -Dsun.net.inetaddr.negative.ttl=0
# Network hardening for flaky/slow connections when Gradle downloads artifacts
# (values are in milliseconds)
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
# Reduce parallelism to lower DNS/query pressure on flaky networks/routers
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
android.enableR8=true
kotlin.jvm.target.validation.mode = IGNORE
# Override NDK version for Rive package 16KB page size compatibility
rive.ndk.version=28.1.13356709
android.ndk.suppressMinSdkVersionError=21
