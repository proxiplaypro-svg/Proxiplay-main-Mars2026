<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ouvrir ce jeu dans Proxiplay</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.proxiplay.proxiplay">
  </noscript>
  <script>
    (function () {
      var path = window.location.pathname || "";
      var prefix = "/j/";
      if (!path.startsWith(prefix)) {
        return;
      }

      var gameId = path.substring(prefix.length).split("/")[0];
      if (!gameId) {
        return;
      }

      var userAgent = navigator.userAgent || "";
      var isiOS = /iPhone|iPad|iPod/i.test(userAgent);
      var storeUrl = isiOS
        ? "https://apps.apple.com/app/id6753818573"
        : "https://play.google.com/store/apps/details?id=com.proxiplay.proxiplay";
      console.log("[QR_LINK_STORE_FALLBACK] gameId=" + gameId + " storeUrl=" + storeUrl);
      window.location.replace(storeUrl);
    })();
  </script>
</body>
</html>
