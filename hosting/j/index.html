<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ouvrir ce jeu dans Proxiplay</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #fffdf6 0%, #f4efe4 100%);
      color: #1f2a37;
      font-family: Arial, sans-serif;
    }

    .qr-launch-card {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 20px 40px rgba(31, 42, 55, 0.12);
    }

    .qr-launch-title {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 700;
    }

    .qr-launch-copy {
      margin: 0 0 20px;
      color: #4f5b67;
      line-height: 1.5;
    }

    .qr-launch-actions {
      display: grid;
      gap: 12px;
    }

    .qr-launch-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 16px;
      border: 1px solid #d7dde5;
      text-decoration: none;
      color: #1f2a37;
      font-weight: 600;
      background: #ffffff;
    }

    .qr-launch-button--primary {
      background: #0c5e52;
      color: #ffffff;
      border-color: #0c5e52;
    }

    .qr-launch-note {
      margin-top: 14px;
      font-size: 13px;
      color: #6b7280;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="qr-launch-card">
    <h1 class="qr-launch-title">Ouvrir ce jeu dans Proxiplay</h1>
    <p class="qr-launch-copy">
      Ce lien ouvre un jeu Proxiplay. Si l application ne s ouvre pas automatiquement, utilisez les boutons ci-dessous.
    </p>
    <div class="qr-launch-actions">
      <a id="qr-open-app" class="qr-launch-button qr-launch-button--primary" href="#">
        Ouvrir dans Proxiplay
      </a>
      <a
        id="qr-open-store"
        class="qr-launch-button"
        href="https://play.google.com/store/apps/details?id=com.proxiplay.proxiplay">
        Telecharger Proxiplay
      </a>
    </div>
    <p id="qr-launch-link" class="qr-launch-note"></p>
  </div>
  <script>
    (function () {
      var path = window.location.pathname || '';
      var prefix = '/j/';
      if (!path.startsWith(prefix)) {
        return;
      }

      var gameId = path.substring(prefix.length).split('/')[0];
      if (!gameId) {
        return;
      }

      var userAgent = navigator.userAgent || '';
      var isAndroid = /Android/i.test(userAgent);
      var isiOS = /iPhone|iPad|iPod/i.test(userAgent);
      var storeUrl = isiOS
        ? 'https://apps.apple.com/app/id6753818573'
        : 'https://play.google.com/store/apps/details?id=com.proxiplay.proxiplay';
      var deepLink = 'proxiplay://game/' + encodeURIComponent(gameId);
      var androidIntentUrl =
        'intent://game/' +
        encodeURIComponent(gameId) +
        '#Intent;scheme=proxiplay;package=com.proxiplay.proxiplay;' +
        'S.browser_fallback_url=' +
        encodeURIComponent(storeUrl) +
        ';end';
      var launchUrl = isAndroid ? androidIntentUrl : deepLink;
      var appButton = document.getElementById('qr-open-app');
      var storeButton = document.getElementById('qr-open-store');
      var linkLabel = document.getElementById('qr-launch-link');
      var canonicalUrl = 'https://play.proxiplay.fr/j/' + gameId;

      appButton.href = launchUrl;
      storeButton.href = storeUrl;
      linkLabel.textContent = 'Lien jeu : ' + canonicalUrl;

      var attemptOpenNative = function (reason) {
        console.log('[QR_LINK_NATIVE_ATTEMPT] url=' + launchUrl + ' reason=' + reason);
        window.location.href = launchUrl;
      };

      appButton.addEventListener('click', function (event) {
        event.preventDefault();
        attemptOpenNative('button_click');
      });

      setTimeout(function () {
        attemptOpenNative('auto_open');
      }, 120);
    })();
  </script>
</body>
</html>
